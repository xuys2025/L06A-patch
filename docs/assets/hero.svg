    </g>
  </g>
  <path d="M65 427H710" stroke="#d5ddd4"/>
  <text x="66" y="464" font-size="14" fill="#71817d" font-family="Consolas,monospace" letter-spacing="1.2">LOCAL WAKE  /  CLOUD ASR + LLM  /  NATIVE TTS</text>
