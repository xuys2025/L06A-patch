    <linearGradient id="body" x1="0" x2="1"><stop stop-color="#182b34"/><stop offset=".55" stop-color="#2e4650"/><stop offset="1" stop-color="#152731"/></linearGradient>
    <linearGradient id="halo"><stop stop-color="#61ead3"/><stop offset="1" stop-color="#2aa9d1"/></linearGradient>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.1" fill="#7e9aa3" opacity=".25"/></pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="518" rx="28" fill="#f4f5f0" stroke="#e1e6dd"/>
  <circle cx="1030" cy="270" r="185" fill="#e2ebe3"/>
  <circle cx="1030" cy="270" r="222" fill="none" stroke="#d9e2d7" stroke-dasharray="3 10"/>
