  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#1c353c">
    <text x="108" y="64" font-size="16" font-weight="650" letter-spacing="3">A NEW CHAPTER FOR YOUR SPEAKER</text>
    <text x="60" y="175" font-size="84" font-weight="750" letter-spacing="-4">L06A Patch<tspan fill="#ec754f">.</tspan></text>
  </g>
  <g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif" fill="#1c353c">
    <text x="65" y="245" font-size="42" font-weight="600">小爱同学，接着聊。</text>
    <text x="66" y="297" font-size="21" fill="#53696b">保留熟悉的唤醒，把对话接到自己的模型。</text>
