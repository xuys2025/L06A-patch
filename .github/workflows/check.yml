name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: assistant-agent/go.sum
      - run: bash scripts/verify/check.sh
      - run: python3 scripts/verify/check_repository.py
      - run: bash scripts/build/build_agent.sh
